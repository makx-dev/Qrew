version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: qrew-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: qrew-postgres
    environment:
      POSTGRES_DB: url_shortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: qrew-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/url_shortener
    depends_on:
      - redis
      - postgres